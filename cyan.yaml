cyanprint: 4
kind: template
owner: atomi
name: workspace
description: AtomiCloud's default workspace scaffold
readme: README.MD
entry: cyan/index.ts
bundledEntry: cyan/index.ts
templates:
  atomi/nix:
    answers:
      cyan/nix/basic: 'yes'
      cyan/nix/llm: 'no'
processors:
- cyan/default@2
plugins: []
resolvers:
- ref: atomi/json-yaml@1
  config:
    arrayStrategy: concat
  files:
  - '.github/workflows/ci.yaml'
  - '.github/workflows/cd.yaml'
  - '.github/workflows/release.yaml'
  - '.github/dependabot.yml'
  - 'Taskfile.yaml'
  - '.coderabbit.yaml'
  - 'atomi_release.yaml'
- ref: atomi/md@1
  config: {}
  files:
  - 'CLAUDE.md'
  - 'README.md'
  - '.envrc'
- ref: atomi/ignore@2
  config: {}
  files:
  - '.gitignore'
  - '.dockerignore'
- ref: atomi/nix@2
  config: {}
  files:
  - 'nix/packages.nix'
  - 'nix/env.nix'
  - 'nix/shells.nix'
  - 'nix/fmt.nix'
  - 'nix/pre-commit.nix'
# INTENTIONALLY INERT until the surfaces sync: `scripts/local/setup.sh` is the owner's
# stated design target for atomi/sh and is carried by the diene workspace node, but it
# does not exist in THIS repo's template payload yet. An unmatched glob is inert, so this
# is declarative now and becomes behavioural exactly when the contest arrives.
# See the PR body -- this is deliberate, not a stale claim.
- ref: atomi/sh@1
  config: {}
  files:
  - 'scripts/local/setup.sh'
