cyanprint: 4
kind: template
owner: atomi
name: workspace
description: AtomiCloud's default workspace scaffold
readme: README.MD
entry: cyan/index.ts
bundledEntry: cyan/index.ts
templates:
  atomi/nix:
    answers:
      cyan/nix/basic: 'yes'
      cyan/nix/llm: 'no'
processors:
- cyan/default
plugins: []
resolvers:
- ref: atomi/json-yaml@1
  config:
    arrayStrategy: concat
  files:
  - '.github/workflows/ci.yaml'
  - '.github/workflows/cd.yaml'
  - '.github/workflows/release.yaml'
  - '.github/dependabot.yml'
  - 'Taskfile.yaml'
  - '.coderabbit.yaml'
  - 'atomi_release.yaml'
- ref: atomi/md@1
  config: {}
  files:
  - 'CLAUDE.md'
  - 'README.md'
  - '.envrc'
- ref: atomi/ignore@2
  config: {}
  files:
  - '.gitignore'
  - '.dockerignore'
- ref: atomi/nix@2
  config: {}
  files:
  - 'nix/packages.nix'
  - 'nix/env.nix'
  - 'nix/shells.nix'
  - 'nix/fmt.nix'
  - 'nix/pre-commit.nix'
