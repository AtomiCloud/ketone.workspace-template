name: S31 Runner Smoke

on:
  push:
    branches:
      - ratchet/workspace-g17-runner-smoke

jobs:
  github-hosted-primary:
    name: GitHub Ubuntu 26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - name: Record runner identity
        run: |
          printf 'runner_os=%s\n' "${RUNNER_OS}"
          uname -a

  namespace-primary:
    name: Namespace Ubuntu 26.04
    runs-on:
      - nscloud-ubuntu-26.04-amd64-16x32-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache-ubuntu-26.04-amd64
    timeout-minutes: 8
    env:
      EXPECTED_STORE_PATH: /nix/store/lpk86xcf9p6v22js8xnvlz7qkcjyhgj3-ratchet-workspace-g17-ubuntu-26.04-amd64
    steps:
      - name: Record runner identity
        run: |
          printf 'runner_os=%s\n' "${RUNNER_OS}"
          uname -a
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          checkout: 'false'
      - name: Prove warm cache restoration
        shell: bash
        run: |
          set -euo pipefail
          test -f "${EXPECTED_STORE_PATH}"
          grep -Fx 'workspace-g17 ubuntu-26.04 cache proof' "${EXPECTED_STORE_PATH}"
          printf 'cache_state=warm restored_path=%s\n' "${EXPECTED_STORE_PATH}"
      - name: Populate exact OS cache
        shell: bash
        run: |
          set -euo pipefail
          proof_file=/tmp/ratchet-workspace-g17-ubuntu-26.04-amd64
          printf 'workspace-g17 ubuntu-26.04 cache proof\n' > "${proof_file}"
          proof_path=$(nix store add-file "${proof_file}")
          test "${proof_path}" = "${EXPECTED_STORE_PATH}"
          test -f "${proof_path}"
          grep -Fx 'workspace-g17 ubuntu-26.04 cache proof' "${proof_path}"
          printf 'cache_populated=true path=%s\n' "${proof_path}"
