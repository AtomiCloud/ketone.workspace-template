name: ⚡ Reusable Environment k3d

# The public surface is exactly the ratified diene-ci-k3d/v1 input set. Image
# ref, producer identity and pull identity are deliberately NOT inputs: they
# live inside the same-run subject document the repository's own artifact-build
# emitted, so a caller cannot substitute a subject the producer never made. The
# Fleet fixture is fixed, not a selector, so it is hard-coded below.
on:
  workflow_call:
    inputs:
      lane: { required: true, type: string }
      repository_id: { required: true, type: number }
      repository_key: { required: true, type: string }
      source_sha: { required: true, type: string }
      garden_lock_digest: { required: true, type: string }
      artifact_digest: { required: true, type: string }
      artifact_provenance_ref: { required: false, type: string, default: '' }
      artifact_attestation_digest: { required: false, type: string, default: '' }
      journey_manifest: { required: false, type: string, default: '' }
      vendor_manifest: { required: false, type: string, default: '' }
      action_id: { required: false, type: string, default: '' }
      closure_digest: { required: false, type: string, default: '' }
      closure_bundle_ref: { required: false, type: string, default: '' }
      closure_signature_bundle_digest: { required: false, type: string, default: '' }
      closure_trust_root_digest: { required: false, type: string, default: '' }
    outputs:
      subject_digest:
        value: ${{ jobs.environment-ditto-build-local.outputs.subject_digest || jobs.environment-ditto-target-pull.outputs.subject_digest || jobs.environment-ditto-vendor.outputs.subject_digest || jobs.environment-absol.outputs.subject_digest || jobs.environment-fleet-independence.outputs.subject_digest }}
      receipt_id:
        value: ${{ jobs.environment-ditto-build-local.outputs.receipt_id || jobs.environment-ditto-target-pull.outputs.receipt_id || jobs.environment-ditto-vendor.outputs.receipt_id || jobs.environment-absol.outputs.receipt_id || jobs.environment-fleet-independence.outputs.receipt_id }}
      core_report_digest:
        value: ${{ jobs.environment-ditto-build-local.outputs.core_report_digest || jobs.environment-ditto-target-pull.outputs.core_report_digest || jobs.environment-absol.outputs.core_report_digest || jobs.environment-fleet-independence.outputs.core_report_digest }}
      vendor_report_digest:
        value: ${{ jobs.environment-ditto-vendor.outputs.vendor_report_digest }}

permissions: {}

jobs:
  # Every refusal decidable without a cluster is decided here, on a
  # GitHub-hosted runner, before any lane job can select a disposable
  # self-hosted runner.
  contract:
    name: Input Contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: &contract-env
      DIENE_LANE: ${{ inputs.lane }}
      GITHUB_REPOSITORY_ID: ${{ inputs.repository_id }}
      GITHUB_REPOSITORY: ${{ inputs.repository_key }}
      GITHUB_SHA: ${{ inputs.source_sha }}
      DIENE_GARDEN_LOCK_DIGEST: ${{ inputs.garden_lock_digest }}
      DIENE_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
      DIENE_ARTIFACT_PROVENANCE_REF: ${{ inputs.artifact_provenance_ref }}
      DIENE_ARTIFACT_ATTESTATION_DIGEST: ${{ inputs.artifact_attestation_digest }}
      DIENE_JOURNEY_MANIFEST: ${{ inputs.journey_manifest }}
      DIENE_VENDOR_MANIFEST: ${{ inputs.vendor_manifest }}
      DIENE_ACTION_ID: ${{ inputs.action_id }}
      DIENE_CLOSURE_DIGEST: ${{ inputs.closure_digest }}
      DIENE_CLOSURE_BUNDLE_REF: ${{ inputs.closure_bundle_ref }}
      DIENE_CLOSURE_SIGNATURE_BUNDLE_DIGEST: ${{ inputs.closure_signature_bundle_digest }}
      DIENE_CLOSURE_TRUST_ROOT_DIGEST: ${{ inputs.closure_trust_root_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: AtomiCloud/actions.setup-nix@v3
      - &derive-identity
        name: Derive the trusted workflow identity and subject handoff
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          # The base workflow identity comes from trusted GitHub context, never
          # from a caller input, and must bind the revision under test.
          test "$WORKFLOW_SHA" = "$SOURCE_SHA"
          {
            printf 'DIENE_BASE_WORKFLOW_REF=%s@%s\n' "${WORKFLOW_REF%@*}" "$WORKFLOW_SHA"
            printf 'DIENE_ARTIFACT_SUBJECT=%s\n' "$RUNNER_TEMP/subject/artifact.v1.json"
          } >>"$GITHUB_ENV"
      - uses: &subject-download actions/download-artifact@v4
        with:
          name: diene-artifact-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subject
      - name: Refuse untrusted selectors and subjects before runner selection
        env: { DIENE_FIXTURE_ID: '' }
        run: nix develop .#ci -c ./scripts/ci/environment-profile-contract.sh --validate-inputs
      - name: Refuse missing runner pin or artifact producer before runner selection
        run: nix develop .#ci -c ./scripts/ci/environment-profile-contract.sh --validate-prerequisites

  environment-ditto-build-local:
    name: environment-ditto-build-local
    if: inputs.lane == 'ditto-build-local'
    needs: contract
    timeout-minutes: 75
    environment: ci-ditto
    concurrency:
      group: k3d-${{ inputs.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-ditto-build-local
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    runs-on:
      - self-hosted
      - linux
      - x64
      - diene-k3d-isolated-v1
      - diene-job-r${{ inputs.repository_id }}-w${{ github.run_id }}-a${{ github.run_attempt }}-jenvironment-ditto-build-local
    env: *contract-env
    outputs: &core-outputs
      subject_digest: ${{ steps.run.outputs.subject_digest }}
      receipt_id: ${{ steps.run.outputs.receipt_id }}
      core_report_digest: ${{ steps.run.outputs.core_report_digest }}
    steps:
      - name: Verify immutable runner before checkout
        env: { DIENE_EXPECTED_JOB_ID: environment-ditto-build-local }
        run: /opt/diene/bin/diene-runner-preflight
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.source_sha }}' }
      - uses: AtomiCloud/actions.setup-nix@v3
      - *derive-identity
      - uses: *subject-download
        with:
          name: diene-artifact-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subject
      - id: run
        env: { DIENE_EXPECTED_JOB_ID: environment-ditto-build-local }
        run: &lane-run |
          # A per-job tracer that only ever lives in process memory: it is never
          # written to GITHUB_ENV, so finding it on any evidence surface means
          # something really did leak its environment.
          DIENE_LEAK_CANARY="diene-canary-$(head -c 18 /dev/urandom | base64 | tr -d '=+/')"
          export DIENE_LEAK_CANARY
          nix develop .#ci -c ./scripts/ci/environment-k3d-run.sh
      - name: Sweep exact receipt after the runtime step
        if: always()
        env: { DIENE_EXPECTED_JOB_ID: environment-ditto-build-local }
        run: &lane-sweep |
          # The sweeper's destructive interface is exactly the four owner
          # selectors. The lane-scoped receipt ID comes from the one shared
          # formula in the library, so the workflow reimplements no receipt
          # ownership of its own.
          # shellcheck source=/dev/null
          . ./scripts/ci/environment-lib.sh
          nix develop .#ci -c ./scripts/ci/environment-receipt-sweep.sh \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --receipt-id "$(diene_receipt_id)"
      # Evidence is NOT uploaded from the job. The enforcing table is still
      # standing at this point — `release` is deferred by contract — and it
      # denies exactly the connections actions/upload-artifact needs, so an
      # in-job upload cannot succeed on a real runner. The lane stages the
      # scanned report into the root-owned publication channel instead, and the
      # runner lifecycle forwards it after runtime absence is proven.
      - if: always()
        env: { DIENE_EXPECTED_JOB_ID: environment-ditto-build-local }
        run: &lane-handoff |
          # shellcheck source=/dev/null
          . ./scripts/ci/environment-lib.sh
          staging=$(diene_require_evidence_publication)
          test -s "$staging/diene-environment-report.v1.json"

  environment-ditto-target-pull:
    name: environment-ditto-target-pull
    if: inputs.lane == 'ditto-target-pull'
    needs: contract
    timeout-minutes: 75
    environment: ci-ditto-pull
    concurrency:
      group: k3d-${{ inputs.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-ditto-target-pull
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
    runs-on:
      - self-hosted
      - linux
      - x64
      - diene-k3d-isolated-v1
      - diene-job-r${{ inputs.repository_id }}-w${{ github.run_id }}-a${{ github.run_attempt }}-jenvironment-ditto-target-pull
    env: *contract-env
    outputs: *core-outputs
    steps:
      - name: Verify immutable runner before checkout
        env: { DIENE_EXPECTED_JOB_ID: environment-ditto-target-pull }
        run: /opt/diene/bin/diene-runner-preflight
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.source_sha }}' }
      - uses: AtomiCloud/actions.setup-nix@v3
      - *derive-identity
      - uses: *subject-download
        with:
          name: diene-artifact-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subject
      - id: run
        env: { DIENE_EXPECTED_JOB_ID: environment-ditto-target-pull }
        run: *lane-run
      - name: Sweep exact receipt after the runtime step
        if: always()
        env: { DIENE_EXPECTED_JOB_ID: environment-ditto-target-pull }
        run: *lane-sweep
      - if: always()
        env: { DIENE_EXPECTED_JOB_ID: environment-ditto-target-pull }
        run: *lane-handoff

  environment-ditto-vendor:
    name: environment-ditto-vendor
    if: inputs.lane == 'ditto-vendor'
    needs: contract
    timeout-minutes: 90
    environment: ci-ditto-vendor
    concurrency:
      group: k3d-${{ inputs.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-ditto-vendor-${{ inputs.action_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    runs-on:
      - self-hosted
      - linux
      - x64
      - diene-k3d-isolated-v1
      - diene-job-r${{ inputs.repository_id }}-w${{ github.run_id }}-a${{ github.run_attempt }}-jenvironment-ditto-vendor
    env: *contract-env
    outputs:
      subject_digest: ${{ steps.run.outputs.subject_digest }}
      receipt_id: ${{ steps.run.outputs.receipt_id }}
      vendor_report_digest: ${{ steps.run.outputs.vendor_report_digest }}
    steps:
      - name: Verify immutable runner before checkout
        env: { DIENE_EXPECTED_JOB_ID: environment-ditto-vendor }
        run: /opt/diene/bin/diene-runner-preflight
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.source_sha }}' }
      - uses: AtomiCloud/actions.setup-nix@v3
      - *derive-identity
      - uses: *subject-download
        with:
          name: diene-artifact-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subject
      - id: run
        # No vendor secret is injected into this step. A secret placed here
        # would be live during preflight, host policy, substrate creation and
        # readiness — long before any masker call — so it would not be
        # phase-scoped in any meaningful sense. The credential is issued by a
        # root-owned broker after readiness and revoked once provider absence
        # is proved; the lane refuses when that broker is absent.
        env:
          DIENE_EXPECTED_JOB_ID: environment-ditto-vendor
        run: |
          DIENE_LEAK_CANARY="diene-canary-$(head -c 18 /dev/urandom | base64 | tr -d '=+/')"
          export DIENE_LEAK_CANARY
          nix develop .#ci -c ./scripts/ci/environment-vendor-run.sh
      - name: Sweep exact receipt after the vendor step
        if: always()
        env: { DIENE_EXPECTED_JOB_ID: environment-ditto-vendor }
        run: *lane-sweep
      - if: always()
        env: { DIENE_EXPECTED_JOB_ID: environment-ditto-vendor }
        run: |
          # shellcheck source=/dev/null
          . ./scripts/ci/environment-lib.sh
          staging=$(diene_require_evidence_publication)
          test -s "$staging/diene-vendor-report.v1.json"

  environment-absol:
    name: environment-absol
    if: inputs.lane == 'absol'
    needs: contract
    timeout-minutes: 120
    environment: ci-absol
    concurrency:
      group: k3d-${{ inputs.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-absol
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    runs-on:
      - self-hosted
      - linux
      - x64
      - diene-k3d-isolated-v1
      - diene-job-r${{ inputs.repository_id }}-w${{ github.run_id }}-a${{ github.run_attempt }}-jenvironment-absol
    env: *contract-env
    outputs: *core-outputs
    steps:
      - name: Verify immutable runner before checkout
        env: { DIENE_EXPECTED_JOB_ID: environment-absol }
        run: /opt/diene/bin/diene-runner-preflight
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.source_sha }}' }
      - uses: AtomiCloud/actions.setup-nix@v3
      - *derive-identity
      - uses: *subject-download
        with:
          name: diene-artifact-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subject
      - id: run
        env: { DIENE_EXPECTED_JOB_ID: environment-absol }
        run: *lane-run
      - name: Sweep exact receipt after the runtime step
        if: always()
        env: { DIENE_EXPECTED_JOB_ID: environment-absol }
        run: *lane-sweep
      - if: always()
        env: { DIENE_EXPECTED_JOB_ID: environment-absol }
        run: *lane-handoff

  environment-fleet-independence:
    name: environment-fleet-independence
    if: inputs.lane == 'fleet-independence'
    needs: contract
    timeout-minutes: 60
    environment: ci-ditto
    concurrency:
      group: k3d-${{ inputs.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-fleet-independence
      cancel-in-progress: false
    permissions:
      contents: read
    runs-on:
      - self-hosted
      - linux
      - x64
      - diene-k3d-isolated-v1
      - diene-job-r${{ inputs.repository_id }}-w${{ github.run_id }}-a${{ github.run_attempt }}-jenvironment-fleet-independence
    env: *contract-env
    outputs: *core-outputs
    steps:
      - name: Verify immutable runner before checkout
        env: { DIENE_EXPECTED_JOB_ID: environment-fleet-independence }
        run: /opt/diene/bin/diene-runner-preflight
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.source_sha }}' }
      - uses: AtomiCloud/actions.setup-nix@v3
      - *derive-identity
      - uses: *subject-download
        with:
          name: diene-artifact-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subject
      - id: run
        # The independence fixture is fixed by the contract, not selected by a
        # caller, so it is hard-coded here.
        env:
          DIENE_EXPECTED_JOB_ID: environment-fleet-independence
          DIENE_FIXTURE_ID: bootstrap-fleet-independence-v1
        run: *lane-run
      - name: Sweep exact receipt after the runtime step
        if: always()
        env:
          DIENE_EXPECTED_JOB_ID: environment-fleet-independence
          DIENE_FIXTURE_ID: bootstrap-fleet-independence-v1
        run: *lane-sweep
      - if: always()
        env:
          DIENE_EXPECTED_JOB_ID: environment-fleet-independence
          DIENE_FIXTURE_ID: bootstrap-fleet-independence-v1
        run: *lane-handoff
