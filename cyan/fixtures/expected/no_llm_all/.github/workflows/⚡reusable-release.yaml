name: ⚡ Reusable Release
on:
  workflow_call:
jobs:
  release:
    name: Semantic Release
    runs-on:
      - nscloud-ubuntu-26.04-amd64-16x32-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache-ubuntu-26.04-amd64
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          auth-bot-app-id: ${{ vars.AUTH_BOT_APP_ID }}
          auth-bot-secret-key: ${{ secrets.AUTH_BOT_SECRET_KEY }}
      - uses: AtomiCloud/actions.cache-npm@v1
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop .#releaser -c scripts/ci/release.sh
